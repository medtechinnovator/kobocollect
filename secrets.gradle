// Helper for grabbing secrets from `secrets.properties` file (in repo root).
// Use rootProject so this works when called from subprojects (e.g. collect_app).
ext.getSecrets = { ->
    def root = rootProject.projectDir
    def secretsFile = file("$root/secrets.properties")
    def oldSecretsFile = file("$root/collect_app/secrets.properties")

    if (!secretsFile.exists() && oldSecretsFile.exists()) {
        throw new InvalidUserDataException("Please move secrets.properties to the root directory!")
    }

    def secrets = new Properties()
    if (secretsFile.exists()) {
        secrets.load(new FileInputStream(secretsFile))
    }

    return secrets
}
